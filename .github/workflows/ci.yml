name: CI

# 构建 / 静态检查 / 测试门禁,外加「生成代码一致性」与「组件库联合编译」检查。
# 覆盖范围说明:
#   - `go build/vet/test ./...` 只覆盖根模块(github.com/jun3372/weaver)。
#     `components/*`(17 个)与 `examples/ddd` 是独立 module,不在根模块的
#     `./...` 内,由 workspace-components job 临时生成 go.work 联合验证。
#   - 生成一致性 job 覆盖仓库内所有已入库的 weaver_gen.go(含上述独立
#     module),已实测可重复生成且零 diff。若后续某 module 因构建标签或
#     网络原因无法生成,需在此处补充排除项并写明原因。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-vet-test:
    name: Build / Vet / Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Print Go version
        run: go version

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

  # 组件库联合编译:临时生成 go.work(不入库,.gitignore 已忽略),让
  # components/* 与 examples/ddd 用本地框架源码而非已发布版本编译验证。
  # go.work 不入库的原因:入库会让所有 contributor 默认进入 workspace 模式
  # (团队决策,见 THEB-6),CI 内按需生成即可获得同样的联合验证能力。
  # genproto replace 的原因:workspace 会合并全部 member 的依赖图,nacos 依赖
  # 链(nacos-sdk-go → grpc)引入旧版 google.golang.org/genproto,与 etcd 依赖
  # 链引入的 genproto/googleapis/* 拆分模块对同一包路径产生 ambiguous import;
  # 把旧版 replace 到新版统一后冲突消失。该 replace 只存在于临时 go.work,
  # 不影响任何入库 module 的依赖选择。
  workspace-components:
    name: Components workspace build / test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Print Go version
        run: go version

      - name: Init temp go.work (not committed)
        run: |
          set -euo pipefail
          # components/* 下有 README.md,不能直接 glob;按含 go.mod 过滤出 module 目录。
          find ./components -mindepth 1 -maxdepth 1 -type d -exec test -f '{}/go.mod' ';' -print | sort > /tmp/moddirs.txt
          echo "workspace members ($(wc -l < /tmp/moddirs.txt) components + root + examples/ddd):"
          cat /tmp/moddirs.txt
          xargs go work init . < /tmp/moddirs.txt
          go work use ./examples/ddd
          go work edit -replace=google.golang.org/genproto=google.golang.org/genproto@v0.0.0-20261026165753-2ffab32bce7e
          go work sync
          cat go.work

      # go.work 上的 genproto replace 会产生 workspace 层的额外校验和,
      # 落在 go.work.sum;两者都必须留在 runner 上,防止污染后续 job 的工作区。
      - name: Build & test each module
        run: |
          set -euo pipefail
          go build ./...
          go vet ./...
          go test ./... -count=1
          # 复用上一步的 module 目录列表(components/* 含 README.md,不能直接 glob)。
          while IFS= read -r d; do
            echo "::group::build $d"
            ( cd "$d" && go build ./... )
            echo "::endgroup::"
            echo "::group::test $d"
            ( cd "$d" && go test ./... -count=1 )
            echo "::endgroup::"
          done < /tmp/moddirs.txt
          for d in ./examples/ddd; do
            echo "::group::build $d"
            ( cd "$d" && go build ./... )
            echo "::endgroup::"
            echo "::group::test $d"
            ( cd "$d" && go test ./... -count=1 )
            echo "::endgroup::"
          done
          # 根模块单独关闭 workspace 再验一遍,确认 go.work 未改变根模块行为。
          echo "::group::root module with GOWORK=off"
          GOWORK=off go build ./... && GOWORK=off go test ./... -count=1
          echo "::endgroup::"

      - name: Ensure go files unchanged by workspace mode
        run: |
          set -euo pipefail
          # workspace 模式下 go build/test 不应改动任何入库文件
          # (go.work/go.work.sum 已被 .gitignore 忽略,porcelain 不会列出)。
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::workspace 模式构建改动了入库文件:"
            git status --porcelain
            exit 1
          fi
          echo "工作区干净,go.work 未入库。"

  generate-consistency:
    name: Generate consistency
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      # 用仓库源码构建 CLI,而不是安装已发布版本:这样才能保证门禁校验的是
      # 本分支的生成器行为。
      - name: Install weaver CLI from source
        run: go install ./cmd/weaver

      - name: Regenerate all committed weaver_gen.go
        run: |
          set -euo pipefail
          export PATH="$(go env GOPATH)/bin:$PATH"
          # 以仓库内已入库的生成文件为准确定覆盖范围,新增产物自动纳入。
          git ls-files '*weaver_gen.go' | xargs -n1 dirname | sort -u > /tmp/gen-dirs.txt
          echo "待校验目录($(wc -l < /tmp/gen-dirs.txt) 个):"
          cat /tmp/gen-dirs.txt
          while IFS= read -r d; do
            echo "::group::weaver generate $d"
            # 每个目录可能是独立 module,必须在各自目录内执行以使用其 go.mod。
            ( cd "$d" && weaver generate . )
            echo "::endgroup::"
          done < /tmp/gen-dirs.txt

      - name: Fail if generated files changed
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- '*weaver_gen.go'; then
            echo "::error::weaver_gen.go 与源码不一致:请本地重新运行 weaver generate 并提交生成结果。"
            exit 1
          fi
          # diff 只能发现已跟踪文件的改动/删除;再兜底检查有无新生成的
          # 未跟踪文件(例如组件新增后尚未 git add 的 weaver_gen.go)。
          if [ -n "$(git status --porcelain --untracked-files=all -- '*weaver_gen.go')" ]; then
            echo "::error::检测到未提交的 weaver_gen.go 变更:"
            git status --porcelain --untracked-files=all -- '*weaver_gen.go'
            exit 1
          fi
          echo "生成代码一致。"
